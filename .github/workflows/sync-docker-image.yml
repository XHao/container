name: Sync Docker Image

on:
  schedule:
    - cron: '0 0 1 * *' # monthly, 1st at 00:00 UTC
  push:
    branches: [ "main" ]
    paths:
      - 'images.txt'
      - '.github/workflows/sync-docker-image.yml'
  workflow_dispatch:
    inputs:
      image_to_sync:
        description: 'Optional: single image to sync (e.g., alpine:latest). Empty = sync all of images.txt'
        required: false
        default: ''
      platform:
        description: 'Platform for single-image sync (ignored when syncing images.txt)'
        required: false
        type: choice
        default: 'linux/arm64'
        options:
          - 'linux/arm64'
          - 'linux/amd64'

permissions:
  contents: read
  packages: write

concurrency:
  group: sync-docker-image
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build sync matrix
        id: set-matrix
        env:
          SINGLE_IMAGE: ${{ github.event.inputs.image_to_sync }}
          SINGLE_PLATFORM: ${{ github.event.inputs.platform }}
        run: |
          if [ -n "$SINGLE_IMAGE" ]; then
            IMAGES="$SINGLE_IMAGE"
            PLATFORMS="$SINGLE_PLATFORM"
          else
            IMAGES=$(grep -vE '^[[:space:]]*(#|$)' images.txt)
            PLATFORMS="linux/amd64 linux/arm64"
          fi

          rows=""
          while IFS= read -r img; do
            for p in $PLATFORMS; do
              rows="$rows{\"image\":\"$img\",\"platform\":\"$p\"},"
            done
          done <<< "$IMAGES"

          MATRIX="[${rows%,}]"
          echo "$MATRIX" | jq -e . > /dev/null # sanity-check the JSON
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  sync_image:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and push image
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          REF="$IMAGE"

          # Docker Hub no longer publishes `centos:latest`. Map it to a valid CentOS Stream image.
          if [[ "$REF" == "centos" || "$REF" == "centos:latest" ]]; then
            echo "::warning::'centos:latest' is not available on Docker Hub; using 'quay.io/centos/centos:stream9' instead."
            REF="quay.io/centos/centos:stream9"
          fi

          # Parse the reference: a ':' only counts as a tag separator when it
          # comes after the last '/' (otherwise it is a registry port). Digest
          # refs (name@sha256:...) are handled first.
          if [[ "$REF" == *"@"* ]]; then
            NAME="${REF%%@*}"
            TAG="${REF##*@}"
          else
            SEGMENT="${REF##*/}"
            if [[ "$SEGMENT" == *":"* ]]; then
              NAME="${REF%:*}"
              TAG="${SEGMENT##*:}"
            else
              NAME="$REF"
              TAG="latest"
            fi
          fi
          # GHCR tags cannot contain ':' (digest refs) and must be lowercase.
          TAG=$(echo "${TAG/:/-}" | tr '[:upper:]' '[:lower:]')

          # GHCR requires lowercase image names.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          SLUG=$(echo "${NAME##*/}" | tr '[:upper:]' '[:lower:]')
          PLATFORM_SUFFIX=$(echo "$PLATFORM" | tr '/' '-')
          TARGET="ghcr.io/${OWNER}/${REPO}/${SLUG}-${PLATFORM_SUFFIX}:${TAG}"

          docker pull --platform "$PLATFORM" "$REF"
          docker tag "$REF" "$TARGET"
          docker push "$TARGET"

          echo "## Synced \`${TARGET}\`" >> "$GITHUB_STEP_SUMMARY"
