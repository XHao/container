name: Build Dev Image

on:
  # rebuild after every successful sync run: dev stays fresh with the
  # pinned base tag's point releases (monthly + any manual/list sync)
  workflow_run:
    workflows: ["Sync Docker Image"]
    types: [completed]
  push:
    branches: [ "main" ]
    paths:
      - 'dev/**'
      - '.github/workflows/build-dev-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-dev-image
  cancel-in-progress: true

jobs:
  build:
    # skip rebuilds when the triggering sync run failed
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set target tag
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          PLATFORM_SUFFIX=$(echo "${{ matrix.platform }}" | tr '/' '-')
          echo "target=ghcr.io/${OWNER}/${REPO}/dev-${PLATFORM_SUFFIX}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./dev
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.vars.outputs.target }}
          cache-from: type=gha,scope=dev-${{ matrix.platform }}
          cache-to: type=gha,scope=dev-${{ matrix.platform }},mode=max

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge into multi-arch tag
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools create \
            -t "ghcr.io/${OWNER}/${REPO}/dev:latest" \
            "ghcr.io/${OWNER}/${REPO}/dev-linux-amd64:latest" \
            "ghcr.io/${OWNER}/${REPO}/dev-linux-arm64:latest"
